upstream django_server { # Define el balanceador de carga
    server web:8000;
    # server web:8001 weight=5; # weight=5 => significa que tendrá mas peso/importancia
    # server web:8002;
}

server {
    listen 80;
    server_name localhost;

    location /static/ {
        alias /code/static/;
    }

    location /media/ {
        alias /code/media/;
    }

    location / {
        proxy_pass http://django_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Configuración adicional para WebSockets
    # location /ws {
    #     proxy_pass http://django_server; # this magic is needed for WebSocket
    #     proxy_http_version  1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    # }
}